[package]
name = "aikong-rust-core"
version = "0.3.0"
edition = "2021"

[lib]
name = "aikong_core"
path = "src/lib.rs"

[[bin]]
name = "aikong-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
tokio-test = "0.4"